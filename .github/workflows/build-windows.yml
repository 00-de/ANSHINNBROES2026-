name: Build Windows Installer

# 「main でも master でも、どのブランチに push しても動く」設定にしています。
# さらに Actions 画面の [Run workflow] ボタンからも手動で実行できます。
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: ソースコードを取り出す
        uses: actions/checkout@v4

      - name: Node.js を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージのインストール
        run: npm install

      - name: 画面（React）のビルド
        run: npm run build

      - name: Windowsインストーラーの作成
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: インストーラーを保存する
        uses: actions/upload-artifact@v4
        with:
          name: AIサポートブラウザPro-Setup
          path: release/*.exe
          if-no-files-found: error
