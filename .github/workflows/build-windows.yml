name: Build Windows Installer

# ・どのブランチに push しても「試しビルド」だけ行う（配布はしない）
# ・v1.0.1 のようにタグを付けたときだけ、GitHub Releases に公開して自動更新を配る
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Releases に書き込むために必要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: ソースコードを取り出す
        uses: actions/checkout@v4

      - name: Node.js を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージのインストール
        run: npm install

      - name: 画面（React）のビルド
        run: npm run build

      - name: 試しビルド（タグなしのとき）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win nsis --publish never

      - name: 公開ビルド（タグを付けたとき）
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: インストーラーを保存する
        uses: actions/upload-artifact@v4
        with:
          name: AIサポートブラウザPro-Setup
          path: release/*.exe
          if-no-files-found: error
