name: Build Windows Installer

# ・どのブランチに push しても「試しビルド」を行う（配布はしない）
# ・v1.0.1 のようにタグを付けたときは、その Release に .exe と latest.yml を貼り付ける
#   （手動で作った Release でも、あとから確実に貼り付く方式にしている）
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Release にファイルを貼り付けるために必要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: ソースコードを取り出す
        uses: actions/checkout@v4

      - name: Node.js を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージのインストール
        run: npm install

      - name: 画面（React）のビルド
        run: npm run build

      # --publish never でも、package.json に publish 設定があるので
      # 自動更新に必要な latest.yml は release フォルダに作られる
      - name: Windowsインストーラーの作成
        run: npx electron-builder --win nsis --publish never

      - name: できたファイルの一覧を表示（確認用）
        shell: bash
        run: ls -lh release || true

      - name: インストーラーを保存する
        uses: actions/upload-artifact@v4
        with:
          name: AIサポートブラウザPro-Setup
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      - name: Release に貼り付ける（タグを付けたときだけ）
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
